apiVersion: apps/v1
kind: Deployment
metadata:
  name: simtrace-worker
  labels:
    app: simtrace
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simtrace
      component: worker
  template:
    metadata:
      labels:
        app: simtrace
        component: worker
    spec:
      containers:
      - name: worker
        image: simtrace/worker:latest
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: simtrace-secrets
              key: mongo-uri
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: simtrace-secrets
              key: redis-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simtrace-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simtrace-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
