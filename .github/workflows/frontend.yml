name: SimTrace Frontend CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  frontend-ci:
    name: Frontend Lint, Test, Security & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Automated Linting
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npx vitest run --passWithNoTests

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=high || true

      - name: Build Production SPA Artifacts
        run: npm run build

      - name: Containerize Frontend Image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Building production OCI container image for SimTrace Frontend"
          docker build -t simtrace-frontend:latest .

