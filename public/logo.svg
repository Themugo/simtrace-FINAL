<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="simGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="100" cy="90" rx="70" ry="70" fill="url(#glowGrad)" opacity="0.3"/>

  <!-- Shield outer border (highlight) -->
  <path d="M100 8 L168 35 L168 90 Q168 145 100 175 Q32 145 32 90 L32 35 Z"
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Shield inner face -->
  <path d="M100 16 L162 41 L162 90 Q162 140 100 168 Q38 140 38 90 L38 41 Z"
        fill="url(#shieldInner)"/>

  <!-- Radar rings -->
  <circle cx="100" cy="90" r="42" stroke="#1d4ed8" stroke-width="1.2" fill="none" opacity="0.7"/>
  <circle cx="100" cy="90" r="30" stroke="#2563eb" stroke-width="1"   fill="none" opacity="0.6"/>
  <circle cx="100" cy="90" r="18" stroke="#3b82f6" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Cross hairs -->
  <line x1="100" y1="50" x2="100" y2="130" stroke="#1d4ed8" stroke-width="0.8" opacity="0.5"/>
  <line x1="60"  y1="90" x2="140" y2="90"  stroke="#1d4ed8" stroke-width="0.8" opacity="0.5"/>

  <!-- SIM card (left, angled) -->
  <g transform="rotate(-8, 68, 80)">
    <rect x="44" y="55" width="36" height="48" rx="4" fill="url(#simGrad)" filter="url(#glow)"/>
    <!-- SIM chip -->
    <rect x="50" y="66" width="24" height="18" rx="2" fill="#d97706"/>
    <rect x="50" y="66" width="24" height="18" rx="2" fill="none" stroke="#b45309" stroke-width="0.5"/>
    <!-- Chip lines -->
    <line x1="58" y1="66" x2="58" y2="84" stroke="#b45309" stroke-width="0.5"/>
    <line x1="66" y1="66" x2="66" y2="84" stroke="#b45309" stroke-width="0.5"/>
    <line x1="50" y1="72" x2="74" y2="72" stroke="#b45309" stroke-width="0.5"/>
    <line x1="50" y1="78" x2="74" y2="78" stroke="#b45309" stroke-width="0.5"/>
    <!-- SIM notch -->
    <polygon points="44,55 54,55 54,62 44,62" fill="#0f172a"/>
  </g>

  <!-- Circuit traces from SIM -->
  <path d="M56 80 L30 80 L30 95 L22 95" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.7" stroke-dasharray="2,2"/>
  <circle cx="22" cy="95" r="2" fill="#38bdf8" opacity="0.8"/>
  <path d="M56 72 L28 72 L28 60 L18 60" stroke="#38bdf8" stroke-width="0.8" fill="none" opacity="0.5" stroke-dasharray="2,2"/>
  <circle cx="18" cy="60" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <path d="M56 88 L32 88 L32 108 L20 108" stroke="#38bdf8" stroke-width="0.8" fill="none" opacity="0.5" stroke-dasharray="2,2"/>
  <circle cx="20" cy="108" r="1.5" fill="#38bdf8" opacity="0.6"/>

  <!-- S letterform -->
  <text x="100" y="110" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900"
        font-size="52" fill="url(#sGrad)" filter="url(#glowStrong)" letter-spacing="-2">S</text>

  <!-- Shield bottom point glow -->
  <path d="M90 168 L100 178 L110 168" fill="#2563eb" opacity="0.6"/>

  <!-- Location pin (right side) -->
  <g transform="translate(148, 55)" filter="url(#glow)">
    <circle cx="0" cy="0" r="8" fill="#0ea5e9"/>
    <circle cx="0" cy="0" r="4" fill="#0f172a"/>
    <path d="M0 8 L0 16" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="198" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="22" letter-spacing="3" fill="white">SIM<tspan fill="#38bdf8">TRACE</tspan><tspan font-size="10" baseline-shift="super" fill="#94a3b8">™</tspan></text>

  <!-- Tagline -->
  <text x="100" y="213" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="6.5" letter-spacing="2.5" fill="#64748b">CONNECT · PROTECT · RECOVER</text>
</svg>
